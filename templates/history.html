
{% extends "base.html" %}
{% block title %}Історія{% endblock %}
{% block content %}
    <h2 class="mb-4">Історія вимірювань</h2>
    
    <div class="card p-4 mb-4 shadow-sm">
        <h4>Статистика</h4>
        <select id="statsDays" class="form-select mb-3">
            <option value="1">За 1 день</option>
            <option value="7">За 7 днів</option>
            <option value="30">За 30 днів</option>
        </select>
        <div id="stats">Завантаження...</div>
    </div>

    <div class="card p-4 shadow-sm">
        <h4>Останні вимірювання</h4>
        <div id="history" class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Час</th>
                        <th>Температура</th>
                        <th>Вологість</th>
                        <th>Тиск</th>
                        <th>VOC</th>
                        <th>CO₂</th>
                        <th>Опади</th>
                    </tr>
                </thead>
                <tbody id="historyData">
                    <tr><td colspan="5">Завантаження...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadStats(days) {
            fetch(`/api/data/stats?days=${days}`)
                .then(res => res.json())
                .then(stats => {
                    const html = `
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">Середня температура: ${stats.avg_temp?.toFixed(1) || 'N/A'} °C</li>
                            <li class="list-group-item">Мінімальна температура: ${stats.min_temp?.toFixed(1) || 'N/A'} °C</li>
                            <li class="list-group-item">Максимальна температура: ${stats.max_temp?.toFixed(1) || 'N/A'} °C</li>
                            <li class="list-group-item">Опади: ${stats.rainfall_mm ?? 'N/A'} мм/м²</li>
                        </ul>`;
                    document.getElementById('stats').innerHTML = html;
                });
        }

        
        fetch('/api/data')
            .then(res => res.json())
            .then(data => {
                
                const rows = data.map((item, index) => {
                    // Обчислюємо різницю в опадах
                    let rainfallDiff = 0;
                    if (index > 0) {
                        const prevTips = data[index - 1].rainfall.tips;
                        rainfallDiff = (item.rainfall.tips - prevTips) * 0.987;
                    }

                    // Форматуємо дату
                    const formatDate = (timestamp) => {
                        const date = new Date(timestamp);
                        date.setHours(date.getHours() + 3);
                        return date.toLocaleString('uk-UA', {
                            timeZone: 'Europe/Kiev',
                            hour12: false,
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit'
                        });
                    };

                    return `
                        <tr>
                            <td>${formatDate(item.timestamp)}</td>
                            <td>${item.environment.temperature.toFixed(2)} °C</td>
                            <td>${item.environment.humidity.toFixed(2)} %</td>
                            <td>${item.environment.pressure.toFixed(2)} гПа</td>
                            <td>${item.air_quality.tvoc} Ppb</td>
                            <td>${item.air_quality.eco2} ppm CO2</td>
                            <td>${rainfallDiff.toFixed(2)} мм</td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('historyData').innerHTML = rows || '<tr><td colspan="7">Немає даних</td></tr>';
            })
            .catch(error => {
                console.error('Помилка при отриманні даних:', error);
                document.getElementById('historyData').innerHTML = 
                    '<tr><td colspan="7">Помилка завантаження даних</td></tr>';
            });

        document.getElementById('statsDays').onchange = (e) => {
            loadStats(e.target.value);
        };

        // Initial load
        loadStats(1);
        loadHistory();
    </script>
{% endblock %}
