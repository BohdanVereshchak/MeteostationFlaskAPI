{% extends "base.html" %}
{% block title %}Історія{% endblock %}
{% block content %}
    <h2 class="mb-4">Історія вимірювань</h2>

    <div class="card p-4 mb-4 shadow-sm">
        <h4>Статистика</h4>
        <select id="statsDays" class="form-select mb-3">
            <option value="1">За 1 день</option>
            <option value="7">За 7 днів</option>
            <option value="30">За 30 днів</option>
        </select>
        <div id="stats">Завантаження...</div>
    </div>

    <div class="card p-4 shadow-sm">
        <h4>Останні вимірювання</h4>
        <div id="history" class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Час</th>
                        <th>Температура</th>
                        <th>Вологість</th>
                        <th>Тиск</th>
                        <th>VOC</th>
                        <th>AQI</th>
                        <th>CO₂</th>
                        <th>Опади</th>
                    </tr>
                </thead>
                <tbody id="historyData">
                    <tr><td colspan="5">Завантаження...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadStats(days) {
            fetch(`/api/data/stats?days=${days}`)
                .then(res => res.json())
                .then(stats => {
                    const html = `
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">Середня температура: ${stats.avg_temp?.toFixed(2) || 'N/A'} °C</li>
                            <li class="list-group-item">Мінімальна температура: ${stats.min_temp?.toFixed(2) || 'N/A'} °C</li>
                            <li class="list-group-item">Максимальна температура: ${stats.max_temp?.toFixed(2) || 'N/A'} °C</li>
                            <li class="list-group-item">Опади: ${stats.rainfall_mm ?? 'N/A'} мм/м²</li>
                        </ul>`;
                    document.getElementById('stats').innerHTML = html;
                });
        }


        function loadHistory() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    const rows = data.map((item, index) => {
                        const currentTips = item.rainfall?.tips ?? 0;
                        const previousItem = data[index + 1];
                        const previousTips = previousItem?.rainfall?.tips ?? null;
                        
                        let rainfallDeltaMm = 'N/A';
                        if (previousTips !== null) {
                            const delta = currentTips - previousTips;
                            rainfallDeltaMm = (Math.max(0, delta) * 0.987).toFixed(2);
                        }

                        return `
                        <tr>
                            <td>${
                            (() => {
                                const timestamp = item.timestamp;
                                if (!timestamp || typeof timestamp !== 'string') return '-';
                                let date;
                                if (timestamp.includes('T')) {
                                    const hasTz = /[zZ]|[+\-]\d{2}:\d{2}$/.test(timestamp);
                                    date = new Date(hasTz ? timestamp : (timestamp + 'Z'));
                                } else {
                                    const [datePart, timePart] = timestamp.split(' ');
                                    const [year, month, day] = datePart.split('-').map(Number);
                                    const [hour, minute, second] = (timePart ? timePart.split(':') : ['0','0','0']).map(Number);
                                    date = new Date(Date.UTC(year, month - 1, day, hour, minute, second));
                                }

                                try {
                                    return date.toLocaleString('uk-UA', {
                                        timeZone: 'Europe/Kyiv',
                                        hour12: false,
                                        year: 'numeric',
                                        month: '2-digit',
                                        day: '2-digit',
                                        hour: '2-digit',
                                        minute: '2-digit',
                                        second: '2-digit'
                                    }).replace(',', '');
                                } catch (e) {
                                    const pad = (num) => String(num).padStart(2, '0');
                                    const kyiv = new Date(date.toLocaleString('en-US', { timeZone: 'Europe/Kyiv' }));
                                    return `${pad(kyiv.getDate())}.${pad(kyiv.getMonth() + 1)}.${kyiv.getFullYear()} ${pad(kyiv.getHours())}:${pad(kyiv.getMinutes())}:${pad(kyiv.getSeconds())}`;
                                }
                            })()
                            }</td>
                            <td>${item.environment.temperature.toFixed(2)} °C</td>
                            <td>${item.environment.humidity.toFixed(2)} %</td>
                            <td>${item.environment.pressure.toFixed(2)} гПа</td>
                            <td>${item.air_quality.tvoc} Ppb</td>
                            <td>${item.air_quality.aqi}</td>
                            <td>${item.air_quality.eco2} ppm</td>
                            <td>${rainfallDeltaMm} мм/м²</td>
                        </tr>
                        `;
                    }).join('');
                    document.getElementById('historyData').innerHTML = rows || '<tr><td colspan="8">Немає даних</td></tr>';
                });
        }

        document.getElementById('statsDays').onchange = (e) => {
            loadStats(e.target.value);
        };

        // Initial load
        loadStats(1);
        loadHistory();
    </script>
{% endblock %}
