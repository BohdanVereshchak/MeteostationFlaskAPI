{% extends "base.html" %}
{% block title %}Налаштування{% endblock %}
{% block content %}
<h2 class="mb-4">Налаштування станції</h2>
<div class="card p-4 shadow-sm">
    <form id="configForm">
        <div class="mb-3">
            <label for="update_interval" class="form-label">Інтервал вимірювань (секунди)</label>
            <input type="number" class="form-control" id="update_interval" name="update_interval" required min="1">
        </div>

        <div class="mb-3">
            <label class="form-label">Місцезнаходження станції</label>
            <div class="mb-3">
                <label for="address_search" class="form-label">Пошук за адресою</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="address_search" 
                           placeholder="Введіть адресу (наприклад: Львів, вул. Степана Бандери 12)">
                    <button class="btn btn-outline-primary" type="button" onclick="searchLocation()">
                        Знайти
                    </button>
                </div>
                <small class="form-text text-muted">Введіть адресу для автоматичного визначення координат</small>
            </div>
            <div class="row mt-3">
                <div class="col">
                    <label for="location_lat" class="form-label">Широта</label>
                    <input type="number" class="form-control" id="location_lat" name="location_lat" 
                           placeholder="49.8815" step="0.0001">
                </div>
                <div class="col">
                    <label for="location_lon" class="form-label">Довгота</label>
                    <input type="number" class="form-control" id="location_lon" name="location_lon" 
                           placeholder="24.0929" step="0.0001">
                </div>
            </div>
            <div id="searchResult" class="mt-2 text-muted small"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Температура (°C)</label>
            <div class="row">
                <div class="col">
                    <input type="number" class="form-control" id="temp_min" name="temp_min" placeholder="Мін.">
                </div>
                <div class="col">
                    <input type="number" class="form-control" id="temp_max" name="temp_max" placeholder="Макс.">
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Вологість (%)</label>
            <div class="row">
                <div class="col">
                    <input type="number" class="form-control" id="hum_min" name="hum_min" placeholder="Мін." min="0" max="100">
                </div>
                <div class="col">
                    <input type="number" class="form-control" id="hum_max" name="hum_max" placeholder="Макс." min="0" max="100">
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Зберегти</button>
    </form>
</div>

<script>
    // Функція пошуку координат за адресою
    async function searchLocation() {
        const address = document.getElementById('address_search').value;
        const resultDiv = document.getElementById('searchResult');
        
        if (!address) {
            resultDiv.innerHTML = '<span class="text-danger">Введіть адресу для пошуку</span>';
            return;
        }

        resultDiv.innerHTML = 'Пошук...';
        
        try {
            const encodedAddress = encodeURIComponent(address);
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodedAddress}&limit=1`);
            const data = await response.json();

            if (data && data.length > 0) {
                const location = data[0];
                document.getElementById('location_lat').value = parseFloat(location.lat).toFixed(4);
                document.getElementById('location_lon').value = parseFloat(location.lon).toFixed(4);
                resultDiv.innerHTML = `<span class="text-success">Знайдено: ${location.display_name}</span>`;
            } else {
                resultDiv.innerHTML = '<span class="text-danger">Адресу не знайдено. Спробуйте інший запит</span>';
            }
        } catch (error) {
            resultDiv.innerHTML = '<span class="text-danger">Помилка пошуку. Спробуйте ще раз</span>';
            console.error('Search error:', error);
        }
    }

    // Handle Enter key in address search
    document.getElementById('address_search').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchLocation();
        }
    });

    // Завантаження конфігурації
    fetch('/api/config')
        .then(res => res.json())
        .then(config => {
            const intervalMs = config.system?.update_interval_ms || 300000;
            document.getElementById('update_interval').value = intervalMs / 1000;

            document.getElementById('temp_min').value = config.temperature?.min ?? '';
            document.getElementById('temp_max').value = config.temperature?.max ?? '';
            document.getElementById('hum_min').value = config.humidity?.min ?? '';
            document.getElementById('hum_max').value = config.humidity?.max ?? '';
            document.getElementById('location_lat').value = config.location?.latitude ?? '49.8815';
            document.getElementById('location_lon').value = config.location?.longitude ?? '24.0929';
        });

    document.getElementById('configForm').onsubmit = async (e) => {
        e.preventDefault();

        const updateIntervalSec = parseInt(document.getElementById('update_interval').value);

        const data = {
            system: {
                update_interval_ms: updateIntervalSec * 1000
            },
            location: {
                latitude: parseFloat(document.getElementById('location_lat').value) || 49.8815,
                longitude: parseFloat(document.getElementById('location_lon').value) || 24.0929
            },
            temperature: {
                min: parseFloat(document.getElementById('temp_min').value) || null,
                max: parseFloat(document.getElementById('temp_max').value) || null
            },
            humidity: {
                min: parseFloat(document.getElementById('hum_min').value) || null,
                max: parseFloat(document.getElementById('hum_max').value) || null
            }
        };

        try {
            const response = await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('Налаштування збережено');
            } else {
                alert('Помилка збереження');
            }
        } catch (err) {
            alert('Помилка збереження');
        }
    };
</script>
{% endblock %}
