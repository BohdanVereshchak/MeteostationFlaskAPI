{% extends "base.html" %}
{% block title %}Налаштування{% endblock %}
{% block content %}
<h2 class="mb-4">Налаштування станції</h2>
<div class="card p-4 shadow-sm">
    <form id="configForm">
        <div class="mb-3">
            <label for="interval" class="form-label">Інтервал вимірювань (секунди)</label>
            <input type="number" class="form-control" id="interval" name="interval" required min="1">
        </div>

        <div class="mb-3">
            <label class="form-label">Температура (°C)</label>
            <div class="row">
                <div class="col">
                    <input type="number" class="form-control" id="temp_min" name="temp_min" placeholder="Мін.">
                </div>
                <div class="col">
                    <input type="number" class="form-control" id="temp_max" name="temp_max" placeholder="Макс.">
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Вологість (%)</label>
            <div class="row">
                <div class="col">
                    <input type="number" class="form-control" id="hum_min" name="hum_min" placeholder="Мін." min="0" max="100">
                </div>
                <div class="col">
                    <input type="number" class="form-control" id="hum_max" name="hum_max" placeholder="Макс." min="0" max="100">
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Зберегти</button>
    </form>
</div>

<script>
    // Завантаження конфігу 
    fetch('/api/config')
        .then(res => res.json())
        .then(config => {
            document.getElementById('interval').value = config.interval || 300;
            document.getElementById('temp_min').value = config.temp_min ?? '';
            document.getElementById('temp_max').value = config.temp_max ?? '';
            document.getElementById('hum_min').value = config.hum_min ?? '';
            document.getElementById('hum_max').value = config.hum_max ?? '';
        });

    // Обробка форми
    document.getElementById('configForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            interval: parseInt(document.getElementById('interval').value),
            temp_min: parseFloat(document.getElementById('temp_min').value),
            temp_max: parseFloat(document.getElementById('temp_max').value),
            hum_min: parseFloat(document.getElementById('hum_min').value),
            hum_max: parseFloat(document.getElementById('hum_max').value)
        };

        try {
            const response = await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (response.ok) {
                alert('Налаштування збережено');
            } else {
                alert('Помилка збереження');
            }
        } catch (err) {
            alert('Помилка збереження');
        }
    };
</script>
{% endblock %}
