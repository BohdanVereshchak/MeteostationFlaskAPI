
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Метеостанція{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-bottom: 20px; }
        .navbar { margin-bottom: 20px; }
        .indicator {
            display: inline-block;
            width: 10px;
            height: 20px;
            margin-left: 5px;
            border: 1px solid #ccc;
            background-color: #eee;
        }
        .green {
            background-color: #28a745 !important;
        }
        .yellow {
            background-color: #ffc107 !important;
        }
        .red {
            background-color: #dc3545 !important;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index_page') }}">Метеостанція</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index_page') }}">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('history_page') }}">Історія</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('settings_page') }}">Налаштування</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="alerts" class="position-fixed top-0 end-0 p-3" style="z-index: 11"></div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
    let notificationsEnabled = false;
    function requestNotificationPermission() {
        if ('Notification' in window) {
            if (Notification.permission === 'granted') {
                notificationsEnabled = true;
                console.log('Notifications already enabled');
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        notificationsEnabled = true;
                        console.log('Notifications enabled');
                        showAlert('✅ Сповіщення увімкнено!', 'success');
                    } else {
                        console.log('Notifications denied');
                        showAlert('❌ Сповіщення відхилено. Увімкніть їх у налаштуваннях браузера.', 'warning', 500);
                    }
                });
            } else {
                console.log('Notifications blocked by user');
                showAlert('🚫 Сповіщення заблоковано. Увімкніть їх у налаштуваннях браузера.', 'danger', 500);
            }
        } else {
            console.log('Browser does not support notifications');
            showAlert('⚠️ Браузер не підтримує сповіщення.', 'warning', 500);
        }
    }
    function showNotification(alert) {
        if (notificationsEnabled && 'Notification' in window && Notification.permission === 'granted') {
            const notification = new Notification('Метеостанція - Попередження', {
                body: alert.message || alert,
                tag: alert.type || 'alert',
                requireInteraction: true
            });

            setTimeout(() => {
                notification.close();
            }, 10000);
        }
    }
    function showAlert(message, type = 'warning', timeout = 5000) {
        const alertsDiv = document.getElementById('alerts');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type} alert-dismissible fade show`;
        alert.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        alertsDiv.appendChild(alert);
        
        // Автоматично закриваємо через 5 секунд
        setTimeout(() => {
            alert.classList.remove('show');
            setTimeout(() => alert.remove(), 150);
        }, timeout);
    }

    // При завантаженні сторінки перевіряємо чи є алерти в URL
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const alerts = urlParams.getAll('alert');
        
        alerts.forEach(alert => {
            showAlert(decodeURIComponent(alert));
        });

        requestNotificationPermission();
    });
    </script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();

        socket.on('alert', function(data) {
            showAlert(data.message, data.type || 'warning');
            showNotification(data);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
